<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যান্টি-থেফট ক্লায়েন্ট অ্যাপ</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0FnEEbLmHdMtK85EPS3vEhIk1ANR81vo",
            authDomain: "android-app-2cd3f.firebaseapp.com",
            databaseURL: "https://android-app-2cd3f-default-rtdb.firebaseio.com",
            projectId: "android-app-2cd3f",
            storageBucket: "android-app-2cd3f.firebasestorage.app",
            messagingSenderId: "363073156053",
            appId: "1:363073156053:web:b8f52ba7fb91133ada435c",
            measurementId: "G-PS90LPJGSJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.registerAndTrackDevice = function() {
            const imei1 = document.getElementById('clientImei1').value.trim();
            const sim = document.getElementById('clientSim').value.trim();
            const statusBox = document.getElementById('statusMessage');

            if (!imei1) {
                alert('দয়া করে ফোনের মূল IMEI 1 নম্বরটি লিখুন!');
                return;
            }

            statusBox.classList.remove('hidden');
            statusBox.className = "p-3 rounded-xl text-xs text-center font-semibold bg-blue-50 text-blue-700";
            statusBox.innerText = "🛰️ জিপিএস স্যাটেলাইট থেকে ডিভাইস লোকেশন নেওয়া হচ্ছে...";

            if (navigator.geolocation) {
                const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

                // watchPosition দিয়ে ফোন যেখানেই যাবে এই IMEI-এর আন্ডারেই লাইভ আপডেট হবে
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const time = new Date().toLocaleTimeString();

                        const devicePayload = {
                            imei: imei1,
                            simNumber: sim || "নম্বর দেওয়া হয়নি",
                            lat: lat,
                            lon: lon,
                            time: time,
                            status: "Protected"
                        };

                        // ফায়ারবেসে সরাসরি `devices/IMEI_NUMBER` হিসেবে সেভ হবে
                        set(ref(db, 'devices/' + imei1), devicePayload)
                        .then(() => {
                            statusBox.className = "p-3 rounded-xl text-xs text-center font-semibold bg-green-50 text-green-700";
                            statusBox.innerHTML = `✅ ডিভাইস রেজিস্টার্ড ও লাইভ ট্র্যাকিং সচল!<br><span class='text-[10px] text-gray-600'>IMEI: ${imei1} | Lat: ${lat}, Lon: ${lon}</span>`;
                        });
                    },
                    (error) => {
                        statusBox.className = "p-3 rounded-xl text-xs text-center font-semibold bg-red-50 text-red-700";
                        statusBox.innerText = `❌ জিপিএস এরর: ${error.message}`;
                    },
                    options
                );
            } else {
                alert("আপনার ডিভাইস জিপিএস সাপোর্ট করে না।");
            }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans">
    <div class="container mx-auto p-4 max-w-lg mt-6 mb-10">
        <div class="bg-indigo-600 text-white p-6 rounded-t-2xl shadow-lg text-center">
            <h1 class="text-2xl font-bold">🛡️ অ্যান্টি-থেফট ইউজার অ্যাপ</h1>
            <p class="text-xs mt-1 text-indigo-100">আইএমইআই বাইন্ডিং ও লাইভ ট্র্যাকিং</p>
        </div>

        <div class="bg-white p-6 rounded-b-2xl shadow-lg space-y-4 border-x border-b border-gray-200">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase">ফোনের IMEI 1 নম্বর:</label>
                <input type="text" id="clientImei1" placeholder="যেমন: 865432041234567" class="w-full mt-1 p-3 border rounded-xl text-sm focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase">বর্তমান সিম নম্বর:</label>
                <input type="text" id="clientSim" placeholder="যেমন: +880 1712-345678" class="w-full mt-1 p-3 border rounded-xl text-sm focus:outline-none">
            </div>

            <button onclick="registerAndTrackDevice()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition shadow text-sm">
                প্রটেকশন অন ও লোকেশন সিঙ্ক করুন
            </button>

            <div id="statusMessage" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
        </div>
    </div>
</body>
</html>
