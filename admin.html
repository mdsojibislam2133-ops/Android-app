<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যান্টি-থেফট অ্যাডমিন প্যানেল</title>
    <!-- Tailwind CSS এবং Leaflet CSS (ম্যাপের জন্য) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 70vh; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-100 font-sans">

    <div class="container mx-auto p-4 max-w-4xl">
        <header class="bg-indigo-600 text-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">🛡️ অ্যান্টি-থেফট লাইভ ট্র্যাকিং প্যানেল</h1>
            <span id="connectionStatus" class="bg-red-500 text-xs px-2 py-1 rounded-full">অসংযুক্ত</span>
        </header>

        <!-- সার্চ বক্স -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-6 flex gap-3">
            <input type="text" id="imeiInput" placeholder="টার্গেট ফোনের IMEI নম্বর লিখুন..." class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500">
            <button onclick="trackDevice()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">লাইভ ট্র্যাক করুন</button>
        </div>

        <!-- ম্যাপ ও তথ্য সেকশন -->
        <div class="bg-white p-4 rounded-xl shadow-md grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-2">
                <div id="map"></div>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                <div>
                    <h2 class="font-bold text-slate-700 mb-3 border-b pb-2">ডিভাইসের তথ্য</h2>
                    <p class="text-sm text-slate-600 mb-2"><strong>আইএমইআই:</strong> <span id="lblImei">-</span></p>
                    <p class="text-sm text-slate-600 mb-2"><strong>স্ট্যাটাস:</strong> <span id="lblStatus" class="text-orange-500 font-bold">-</span></p>
                    <p class="text-sm text-slate-600 mb-2"><strong>অ্যাটিটিউড (Lat):</strong> <span id="lblLat">-</span></p>
                    <p class="text-sm text-slate-600 mb-2"><strong>লংটিটিউড (Lon):</strong> <span id="lblLon">-</span></p>
                    <p class="text-sm text-slate-600"><strong>শেষ আপডেট:</strong> <span id="lblTime">-</span></p>
                </div>
                <div class="mt-4">
                    <button onclick="lockDevice()" class="w-full bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700 transition">রিমোট লক করুন</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase এবং Leaflet JS স্ক্রিপ্ট -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // আপনার ফায়ারবেস কনফিগারেশন এখানে দিন
        const firebaseConfig = {
            databaseURL: "https://android-app-2cd3f-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let map = L.map('map').setView([23.8103, 90.4125], 13); // ডিফল্ট ঢাকা কেন্দ্রিক
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let marker = null;

        window.trackDevice = function() {
            const imei = document.getElementById('imeiInput').value.trim();
            if (!imei) {
                alert("দয়া করে সঠিক IMEI নম্বর লিখুন!");
                return;
            }

            document.getElementById('lblImei').innerText = imei;
            const deviceRef = ref(db, 'devices/' + imei);

            document.getElementById('connectionStatus').innerText = "যুক্ত হয়েছে";
            document.getElementById('connectionStatus').className = "bg-green-500 text-xs px-2 py-1 rounded-full text-white";

            // ফায়ারবেস থেকে রিয়েল-টাইম লোকেশন ডেটা রিড করা
            onValue(deviceRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const lat = data.lat;
                    const lon = data.lon;
                    const status = data.status;
                    const time = new Date(Number(data.time)).toLocaleTimeString();

                    document.getElementById('lblStatus').innerText = status;
                    document.getElementById('lblLat').innerText = lat;
                    document.getElementById('lblLon').innerText = lon;
                    document.getElementById('lblTime').innerText = time;

                    // ম্যাপে মার্কার আপডেট করা
                    if (marker) {
                        marker.setLatLng([lat, lon]);
                    } else {
                        marker = L.marker([lat, lon]).addTo(map);
                    }
                    map.setView([lat, lon], 17); // লাইভ লোকেশনে জুম ইন করবে
                } else {
                    alert("এই IMEI নম্বরের কোনো লাইভ ডেটা পাওয়া যায়নি!");
                }
            });
        };
    </script>
</body>
</html>
